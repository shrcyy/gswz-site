<link rel="stylesheet" href="assets/css/style.css">

<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">自</span>
      <span class="brand-text">
        <strong>工商自委</strong>
        <small>辽宁工程技术大学 · 工商管理学院</small>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="archive.html">资料库</a>
      <a href="news.html" class="active">通知公告</a>
      <a href="gallery.html">活动照片</a>
      <a href="manual.html">履职手册</a>
    </nav>
    <div class="header-actions" id="authArea"></div>
  </div>
</header>

<main>
  <section class="section" style="padding-top:52px;">
    <div class="container">
      <div class="section-head with-line" style="margin-bottom:22px;">
        <div>
          <div class="eyebrow">通知公告</div>
          <h2>学院与学生组织的公开通知</h2>
          <p>公开通知任何人可查看；标注「内部」的通知仅登录成员可见。</p>
        </div>
        <a class="more" href="studio.html" id="postEntry" style="display:none;">发布通知 →</a>
      </div>
      <div id="noticeList">
        <div class="empty"><h3>正在加载…</h3></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="footer-brand">工商自委<small>通知公告</small></div>
        <p>公开通知面向全院同学，内部通知面向组织成员。发布即生效。</p>
      </div>
      <div>
        <h4>导航</h4>
        <div class="footer-links">
          <a href="index.html">首页</a>
          <a href="archive.html">资料库</a>
          <a href="gallery.html">活动照片</a>
          <a href="manual.html">履职手册</a>
        </div>
      </div>
      <div>
        <h4>说明</h4>
        <p>如需更正或撤回通知，请联系发布人或办公室管理员。</p>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 辽宁工程技术大学工商管理学院大学生自律委员会</span></div>
  </div>
</footer>

<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  const me = await getProfile(true);
  if (me && me.status === 'approved') {
    const entry = document.getElementById('postEntry');
    entry.style.display = 'inline';
  }
  const box = document.getElementById('noticeList');
  try {
    const { data, error } = await sb.from('notices')
      .select('*')
      .order('pinned', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(200);
    if (error) throw error;
    if (!data || !data.length) {
      box.innerHTML = '<div class="empty"><h3>暂无通知</h3><p>新通知发布后会显示在这里。</p></div>';
      return;
    }
    box.innerHTML = data.map(n => `
      <article class="notice-item${n.pinned ? ' pinned' : ''}">
        <div class="notice-head">
          <h3>${esc(n.title)}</h3>
          ${n.pinned ? '<span class="badge internal">置顶</span>' : ''}
          <span class="badge ${n.visibility}">${n.visibility === 'public' ? '公开' : '内部'}</span>
        </div>
        <div class="notice-meta">
          <span>${fmtDate(n.created_at)}</span>
          ${n.author_email ? `<span>发布：${esc(n.author_email.split('@')[0])}</span>` : ''}
        </div>
        <div class="notice-body">${esc(n.body)}</div>
      </article>`).join('');
  } catch (e) {
    box.innerHTML = `<div class="empty"><h3>通知暂时不可用</h3><p>${esc(e.message || '请稍后刷新重试')}</p></div>`;
  }
})();
</script>
</body>
</html>
