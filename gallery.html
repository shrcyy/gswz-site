<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>活动照片 · 工商自委</title>
<meta name="description" content="工商自委活动照片：寝室文化节、安全教育、例会与工作日常等活动记录。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='8'%20fill='%2316324f'/%3E%3Ctext%20x='32'%20y='46'%20font-size='30'%20text-anchor='middle'%20font-family='serif'%20fill='%23d8b869'%3E%E8%87%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark">自</span>
      <span class="brand-text">
        <strong>工商自委</strong>
        <small>辽宁工程技术大学 · 工商管理学院</small>
      </span>
    </a>
    <nav class="main-nav">
      <a href="index.html">首页</a>
      <a href="archive.html">资料库</a>
      <a href="news.html">通知公告</a>
      <a href="gallery.html" class="active">活动照片</a>
      <a href="manual.html">履职手册</a>
    </nav>
    <div class="header-actions" id="authArea"></div>
  </div>
</header>

<main>
  <section class="section" style="padding-top:52px;">
    <div class="container">
      <div class="section-head with-line" style="margin-bottom:22px;">
        <div>
          <div class="eyebrow">活动记录</div>
          <h2>一场一场攒下来的照片</h2>
          <p>活动照片按活动归档。公开照片任何人可看；标注「内部」的照片仅登录成员可见。</p>
        </div>
        <a class="more" href="studio.html" id="uploadEntry" style="display:none;">上传照片 →</a>
      </div>
      <div id="galleryBody">
        <div class="empty"><h3>正在加载…</h3></div>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div>
        <div class="footer-brand">工商自委<small>活动照片</small></div>
        <p>所有照片永久归档，换届不丢失。</p>
      </div>
      <div>
        <h4>导航</h4>
        <div class="footer-links">
          <a href="index.html">首页</a>
          <a href="archive.html">资料库</a>
          <a href="news.html">通知公告</a>
          <a href="manual.html">履职手册</a>
        </div>
      </div>
      <div>
        <h4>说明</h4>
        <p>照片上传请标注活动名称与拍摄日期，便于归档检索。</p>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 辽宁工程技术大学工商管理学院大学生自律委员会</span></div>
  </div>
</footer>

<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async () => {
  const me = await getProfile(true);
  if (me && me.status === 'approved') document.getElementById('uploadEntry').style.display = 'inline';

  const body = document.getElementById('galleryBody');
  let photos = [];
  try {
    const { data, error } = await sb.from('photos')
      .select('*')
      .order('created_at', { ascending: false })
      .limit(400);
    if (error) throw error;
    photos = data || [];
  } catch (e) {
    body.innerHTML = `<div class="empty"><h3>照片暂时不可用</h3><p>${esc(e.message || '请稍后刷新重试')}</p></div>`;
    return;
  }
  if (!photos.length) {
    body.innerHTML = `<div class="empty"><h3>暂无照片</h3><p>${me ? '去工作台上传第一张活动照片。' : '活动照片上传后会显示在这里。'}</p></div>`;
    return;
  }

  const groups = new Map();
  photos.forEach(p => {
    if (!groups.has(p.activity)) groups.set(p.activity, []);
    groups.get(p.activity).push(p);
  });

  // 预取图片地址（内部照片用签名链接）
  const urls = {};
  await Promise.all(photos.map(async p => {
    try {
      if (p.visibility === 'public') {
        const { data } = sb.storage.from(SITE.buckets.public).getPublicUrl(p.file_path);
        urls[p.id] = data.publicUrl;
      } else {
        const { data } = await sb.storage.from(SITE.buckets.internal).createSignedUrl(p.file_path, 3600);
        urls[p.id] = data ? data.signedUrl : '';
      }
    } catch (e) { urls[p.id] = ''; }
  }));

  let html = '';
  let idx = 0;
  for (const [activity, list] of groups) {
    idx += 1;
    html += `<div class="section-head with-line" style="margin:38px 0 16px;${idx === 1 ? 'margin-top:0;' : ''}">
      <div>
        <div class="eyebrow">活动 ${String(idx).padStart(2, '0')}</div>
        <h2 style="font-size:20px;">${esc(activity)}</h2>
      </div>
      <span class="more">${list.length} 张</span>
    </div><div class="photo-grid">`;
    html += list.map(p => {
      const u = urls[p.id];
      const cap = esc(p.caption || p.event_date || '');
      if (!u) return `<div class="photo-card locked">图片地址缺失</div>`;
      return `<a class="photo-card" href="${u}" target="_blank" rel="noopener" title="${cap}">
        <img src="${u}" alt="${cap}" loading="lazy">
        <div class="cap">${cap}${p.visibility === 'internal' ? ' · 内部' : ''}</div>
      </a>`;
    }).join('');
    html += '</div>';
  }
  body.innerHTML = html;
})();
</script>
</body>
</html>
