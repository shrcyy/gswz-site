<script src="https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
(function () {
  if (!window.MANUAL_DATA) {
    document.getElementById('manualBody').innerHTML = '<div class="empty"><h3>手册数据未加载</h3><p>请刷新页面重试。</p></div>';
    return;
  }
  const chapters = MANUAL_DATA.chapters;
  const navEl = document.getElementById('chapterNav');
  const bodyEl = document.getElementById('manualBody');
  const pagerEl = document.getElementById('manualPager');
  const inputEl = document.getElementById('searchInput');
  const resultEl = document.getElementById('searchResult');
  let current = 0;
  const allBlocks = [];

  chapters.forEach((ch, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `${i + 1}. ${esc(ch.title)}`;
    b.addEventListener('click', () => showChapter(i));
    navEl.appendChild(b);
    ch.blocks.forEach((blk, j) => allBlocks.push({ ch: i, bi: j, b: blk, title: ch.title }));
  });

  function blockHtml(b, bi) {
    const id = 'blk-' + bi;
    if (b.t === 'h2') return `<h2 id="${id}" style="font-size:18px;margin:28px 0 12px;">${esc(b.text)}</h2>`;
    if (b.t === 'h3') return `<h3 id="${id}">${esc(b.text)}</h3>`;
    if (b.t === 'p') return `<p id="${id}">${esc(b.text)}</p>`;
    if (b.t === 'table') {
      let html = `<table id="${id}">`;
      if (b.header && b.header.length) html += '<thead><tr>' + b.header.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead>';
      html += '<tbody>' + b.rows.map(r => '<tr>' + r.map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>';
      return html;
    }
    return '';
  }

  function renderPager(i) {
    const prev = document.getElementById('pagerPrev');
    const next = document.getElementById('pagerNext');
    if (i > 0) {
      prev.style.display = 'inline-flex';
      prev.textContent = '← ' + chapters[i - 1].title;
      prev.onclick = e => { e.preventDefault(); showChapter(i - 1); };
    } else prev.style.display = 'none';
    if (i < chapters.length - 1) {
      next.style.display = 'inline-flex';
      next.textContent = chapters[i + 1].title + ' →';
      next.onclick = e => { e.preventDefault(); showChapter(i + 1); };
    } else next.style.display = 'none';
  }

  function showChapter(i) {
    current = i;
    const ch = chapters[i];
    Array.from(navEl.children).forEach((b, j) => b.classList.toggle('active', j === i));
    bodyEl.innerHTML = `<div class="chapter">第 ${i + 1} 章 · 共 ${chapters.length} 章</div><h2>${esc(ch.title)}</h2><div class="content">${ch.blocks.map((b, j) => blockHtml(b, j)).join('')}</div>`;
    renderPager(i);
    resultEl.innerHTML = '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function textOf(b) {
    if (!b) return '';
    if (b.t === 'table') {
      const parts = [];
      if (b.header) parts.push(...b.header);
      b.rows.forEach(r => parts.push(...r));
      return parts.join(' ');
    }
    return b.text || '';
  }

  function runSearch() {
    const kw = (inputEl.value || '').trim();
    if (kw.length < 2) { resultEl.innerHTML = ''; return; }
    const hits = [];
    allBlocks.forEach(item => {
      const txt = textOf(item.b);
      if (txt.indexOf(kw) > -1) {
        const p = txt.indexOf(kw);
        const seg = (p > 22 ? '…' : '') + txt.slice(Math.max(0, p - 22), p + kw.length + 22) + '…';
        hits.push({ ...item, seg });
      }
    });
    if (!hits.length) {
      resultEl.innerHTML = `<div class="search-results"><div style="padding:10px;font-size:13px;color:var(--ink-3);">未找到与「${esc(kw)}」相关的内容</div></div>`;
      return;
    }
    resultEl.innerHTML = `<div class="search-results">${hits.slice(0, 30).map((h, idx) => {
      const safeSeg = esc(h.seg);
      const safeKw = esc(kw);
      const parts = safeSeg.split(safeKw);
      const marked = parts.join(`<span class="hl">${safeKw}</span>`);
      return `<button type="button" data-hit="${idx}">${marked}<span style="display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;">${esc(h.title)}</span></button>`;
    }).join('')}</div>`;
    resultEl.querySelectorAll('button[data-hit]').forEach(btn => {
      btn.addEventListener('click', () => {
        const h = hits[Number(btn.dataset.hit)];
        showChapter(h.ch);
        setTimeout(() => {
          const el = document.getElementById('blk-' + h.bi);
          if (el) {
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            el.style.background = '#f7e9b8';
            setTimeout(() => { el.style.background = ''; }, 2600);
          }
        }, 60);
      });
    });
  }

  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
  inputEl.addEventListener('input', () => { if (inputEl.value.trim().length < 2) resultEl.innerHTML = ''; });
  showChapter(0);
})();
</script>
